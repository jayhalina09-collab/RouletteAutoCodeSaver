plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.androidcodeautomation'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.androidcodeautomation'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    
    // Explicitly enforce modern Kotlin stdlib and exclude legacy sub-modules
    implementation("org.jetbrains.kotlin:kotlin-stdlib:1.8.22") {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

// Global resolution strategy to replace duplicate JDK artifacts across all dependencies
configurations.all {
    resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                if (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8') {
                    details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                }
            }
        }
    }
}
