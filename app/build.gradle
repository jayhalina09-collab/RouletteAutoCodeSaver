plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.androidcodeautomation'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.androidcodeautomation'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
}
